name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Consumed by foundry.toml's [rpc_endpoints] mainnet entry -- the
      # fork test (test/LiquidationShieldFork.t.sol) needs a real mainnet
      # RPC to fork from. Set as a repo/org secret.
      MAINNET_RPC: ${{ secrets.MAINNET_RPC }}
    defaults:
      run:
        # This workflow used to live at contracts/.github/workflows/test.yml,
        # a path GitHub Actions never actually scans (only the repo root's
        # .github/workflows/ is discovered) -- it had 0 runs, ever. Moved
        # here to the real location; actions/checkout still puts the repo at
        # its root regardless of where this file lives, and foundry.toml is
        # in contracts/, so every run: step below needs this.
        working-directory: contracts
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      # `forge test` exits 0 on an empty suite. Now that this workflow is
      # actually discoverable (see the working-directory note above),
      # nothing stops that from silently passing again if test/ ever goes
      # back to empty -- fail explicitly before trusting the test step's
      # own exit code.
      - name: Guard against an empty test suite
        run: |
          COUNT=$(forge test --list --json 2>/dev/null | jq '[.[] | to_entries[]? | .value[]?] | length')
          echo "Discovered $COUNT test function(s)."
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No test functions found -- an empty suite must not pass CI silently."
            exit 1
          fi

      - name: Run Forge tests
        run: forge test -vvv --fail-fast
